<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Glowing Header Badge -->
  <rect x="40" y="32" width="410" height="28" rx="14" fill="rgba(37, 99, 235, 0.2)" stroke="#38bdf8" stroke-width="1" />
  <circle cx="56" cy="46" r="5" fill="#10b981" filter="url(#glow)" />
  <text x="70" y="50" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="1">SIH 2026 PS 26171 • ISRO / DEPT OF SPACE</text>

  <!-- Main Title -->
  <text x="40" y="115" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="52" font-weight="900" fill="url(#textGrad)" letter-spacing="-1">PIXEL — ODVPA</text>
  <text x="40" y="150" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">On-Device Visual Perception for Lightweight Autonomous Browser Agents</text>

  <!-- 4 Core Metric Feature Cards -->
  <!-- Card 1: Zero-Cost Fast Path -->
  <rect x="40" y="185" width="260" height="195" rx="12" fill="url(#boxGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
  <text x="60" y="220" font-family="-apple-system, sans-serif" font-size="22">⚡</text>
  <text x="90" y="220" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Zero-Cost AXTree</text>
  <text x="60" y="252" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Extracts full accessibility tree via CDP at $0.00 cost before calling vision models.</text>
  <rect x="60" y="335" width="120" height="24" rx="6" fill="#1e293b" />
  <text x="70" y="351" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">85% VLM BYPASS</text>

  <!-- Card 2: Minimal Crop -->
  <rect x="320" y="185" width="260" height="195" rx="12" fill="url(#boxGrad)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5" />
  <text x="340" y="220" font-family="-apple-system, sans-serif" font-size="22">🔍</text>
  <text x="370" y="220" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Crop-Only VLM</text>
  <text x="340" y="252" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Crops ONLY unresolved visual patches (canvas, custom charts) instead of 4K viewports.</text>
  <rect x="340" y="335" width="135" height="24" rx="6" fill="#1e293b" />
  <text x="350" y="351" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#818cf8">98.5% PIXEL SAVINGS</text>

  <!-- Card 3: 450M -> 1.6B Cascade -->
  <rect x="600" y="185" width="260" height="195" rx="12" fill="url(#boxGrad)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5" />
  <text x="620" y="220" font-family="-apple-system, sans-serif" font-size="22">🧠</text>
  <text x="650" y="220" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">450M → 1.6B Ladder</text>
  <text x="620" y="252" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Tier A (450M) runs default; Tier B (1.6B) lazy-loads only on ambiguous visual confidence.</text>
  <rect x="620" y="335" width="130" height="24" rx="6" fill="#1e293b" />
  <text x="630" y="351" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#c084fc">0 MB IDLE TIER B</text>

  <!-- Card 4: 100% Privacy Gate -->
  <rect x="880" y="185" width="280" height="195" rx="12" fill="url(#boxGrad)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" />
  <text x="900" y="220" font-family="-apple-system, sans-serif" font-size="22">🛡️</text>
  <text x="930" y="220" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">5-Stage Privacy Gate</text>
  <text x="900" y="252" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Aadhaar, PAN, CC, passwords, and API secrets are blocked/redacted before reaching model.</text>
  <rect x="900" y="335" width="150" height="24" rx="6" fill="#1e293b" />
  <text x="910" y="351" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399">0 CLOUD DATA EGRESS</text>
</svg>
